[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "stock-office"
version = "0.0.1"
description = "Stock Office backend: TradingAgents adapter, event log/replay, read-only market data (PAPER ONLY)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "tzdata>=2024.1",
    "exchange-calendars>=4.11",
]

[project.optional-dependencies]
# Read-only public market data (Yahoo via yfinance). Live use only; never in deterministic tests.
live = ["yfinance>=1.7.0"]
# TradingAgents engine, pinned to an audited upstream commit (v0.6.0).
engine = [
    "tradingagents @ git+https://github.com/TauricResearch/TradingAgents@1394a3f72aa4393e1a98f51b382434c4b4c2d972",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/stock_office"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m \"not live\""
markers = [
    "live: needs network and/or API keys; run explicitly with -m live",
    "engine: needs the optional TradingAgents package installed (no network)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
packages = ["stock_office"]
mypy_path = "src"
strict = true
ignore_missing_imports = true
